# Foreword as a DMG to download: open it and drag the app to Applications.
#
# Run it from the Actions tab (Release build ▸ Run workflow) for a build of a
# branch, kept with the run for 30 days; or push a version tag that matches
# tauri.conf.json (v0.1.0) for a GitHub Release with the DMG attached.
#
# The app carries OpenCode and Tinymist (scripts/bundle-*.mjs), so a Mac
# needs nothing else for the preview, or for an assistant to sign in to.
#
# A release is also an update: the app checks the latest release's
# latest.json (tauri.conf.json's plugins.updater), and installs the update
# only if it's signed with the updater key, kept in the TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (and ~/.tauri on JJ's Mac).
# npm run release -- 0.2.0 sets the version everywhere and pushes its tag.
#
# Without Apple signing secrets it's signed ad hoc: the first time, macOS asks
# (System Settings ▸ Privacy & Security ▸ Open Anyway). `gh release download`
# and `gh run download` don't mark the DMG as from the internet, so a copy
# fetched with them opens without asking. With a Developer ID certificate, it's
# signed and notarized, and opens like any app from the internet; set all six
# of these repository secrets:
#   APPLE_CERTIFICATE           the Developer ID Application certificate and its key, as a .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                    the Apple Account of the developer team
#   APPLE_PASSWORD              an app-specific password for it (account.apple.com ▸ Sign-In and Security)
#   APPLE_TEAM_ID               the team's ID (TEAMID above)
# Then OpenCode and Tinymist, which go in as resources Tauri doesn't sign, are
# signed first (scripts/sign-bundled.mjs: OpenCode keeps its JIT), Tauri signs
# the app with the hardened runtime and notarizes it, and a last step checks
# that Gatekeeper takes it as notarized.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The commits since the last version, for its notes.
          fetch-depth: 0

      - name: The tag is the app's version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but tauri.conf.json's version is $version. Tag v$version, or change the version first."
            exit 1
          fi

      - name: What's new since the last version
        id: notes
        if: github.ref_type == 'tag'
        run: |
          # The version's section of CHANGELOG.md ("## 0.2.0 · …" up to the next "## "), else the commits since the last version.
          section=$(awk -v v="${GITHUB_REF_NAME#v}" '/^## /{ if (found) exit; if ($2 == v) { found=1; next } } found' CHANGELOG.md 2>/dev/null | sed -e '/./,$!d')
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo 'body<<__NOTES__'
            if [ -n "$section" ]; then
              printf '%s\n' "$section"
            elif [ -z "$prev" ]; then
              echo 'The first release of Foreword.'
            else
              git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" | grep -v -E '^- (TODO|Version )' | head -40
            fi
            echo '__NOTES__'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: OpenCode and Tinymist, to go inside the app
        run: |
          # The runner's Homebrew is a snapshot (it once had OpenCode 1.x): today's formula, for 2.x.
          brew update --quiet
          brew install opencode
          node scripts/bundle-opencode.mjs
          node scripts/bundle-tinymist.mjs

      - name: Apple signing, if it's set up
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret, so the app is signed ad hoc."
            exit 0
          fi
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but $name isn't: set all six signing secrets, or none."
              exit 1
            fi
          done
          # The certificate in a keychain of the run's own: for the bundled programs, then for Tauri, which finds it there.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # OpenCode and Tinymist go in as resources, which Tauri doesn't sign.
          node scripts/sign-bundled.mjs "$APPLE_SIGNING_IDENTITY"
          # The app with this identity, in place of tauri.bundle.json's ad hoc one.
          node -e 'require("fs").writeFileSync("src-tauri/tauri.signing.json", JSON.stringify({ bundle: { macOS: { signingIdentity: process.env.APPLE_SIGNING_IDENTITY, hardenedRuntime: true } } }))'
          echo "config=--config src-tauri/tauri.signing.json" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          # Tauri reads these from the environment (the Apple ID ones to notarize); unset, they'd be empty and stop the build.
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$name<<__VALUE__"; printf '%s\n' "${!name}"; echo "__VALUE__"; } >> "$GITHUB_ENV"
          done

      - name: Build the app, its DMG and its update
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
        with:
          args: --config src-tauri/tauri.bundle.json --config src-tauri/tauri.updates.json ${{ steps.signing.outputs.config }}
          # A tag makes a release with the DMG and the update; a run from the Actions tab only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Foreword ${{ github.ref_name }}
          # The notes are what the app's update dialog shows under What's new.
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            **Install:** open the DMG and drag Foreword to Applications.${{ steps.signing.outputs.signed != 'true' && ' If macOS says it can''t check the app, open System Settings ▸ Privacy & Security and click Open Anyway, once.' || '' }} Already have it? Foreword offers the update itself.
          # The latest release (not a prerelease) is the one the app's update feed points at.
          prerelease: false
          includeUpdaterJson: true
          # Names without the version, so releases/latest/download/Foreword_aarch64.dmg is always the newest (the website links to it).
          assetNamePattern: Foreword_[arch][ext]

      - name: It's signed and notarized
        if: steps.signing.outputs.signed == 'true'
        run: |
          app=src-tauri/target/release/bundle/macos/Foreword.app
          codesign --verify --deep --strict --verbose=2 "$app"
          # OpenCode keeps its JIT: signed again without its entitlements, it would run six times slower.
          if ! codesign -d --entitlements - "$app/Contents/Resources/opencode/opencode" 2>/dev/null | grep -q com.apple.security.cs.allow-jit; then
            echo "::error::OpenCode inside the app lost its JIT entitlement (src-tauri/entitlements/opencode.plist)."
            exit 1
          fi
          xcrun stapler validate "$app"
          assessed=$(spctl --assess --type execute --verbose=2 "$app" 2>&1 || true)
          echo "$assessed"
          if ! grep -q "source=Notarized Developer ID" <<< "$assessed"; then
            echo "::error::Gatekeeper doesn't take the app as notarized."
            exit 1
          fi

      - name: Forget the signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Keep the DMG with the run
        uses: actions/upload-artifact@v4
        with:
          name: foreword-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
