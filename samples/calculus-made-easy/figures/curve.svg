    <line x1="60" y1="104.5" x2="64" y2="104.5"/>
    <line x1="60" y1="98" x2="64" y2="98"/>
    <line x1="60" y1="91.5" x2="64" y2="91.5"/>
    <line x1="58" y1="85" x2="66" y2="85"/>
    <line x1="60" y1="78.5" x2="64" y2="78.5"/>
    <line x1="60" y1="72" x2="64" y2="72"/>
