  <text x="56" y="120.5" text-anchor="end">50</text>
  <text x="56" y="88" text-anchor="end">100</text>
  <text x="56" y="55.5" text-anchor="end">150</text>
  <text x="56" y="23" text-anchor="end">200</text>
  <g stroke="#444" stroke-width="0.6">
    <line x1="17" y1="148" x2="17" y2="152"/>
    <line x1="32" y1="148" x2="32" y2="152"/>
