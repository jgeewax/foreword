  <line x1="62" y1="154" x2="62" y2="13" stroke="#444" stroke-width="1"/>
  <text x="150" y="153" font-size="9.5" font-style="italic">x</text>
  <text x="62" y="9" text-anchor="middle" font-size="9.5" font-style="italic">y</text>
  <g stroke="#444" stroke-width="0.6">
