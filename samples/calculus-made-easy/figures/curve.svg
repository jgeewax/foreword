<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 168" width="156pt" height="168pt" font-family="New Computer Modern" font-size="9">
  <!-- Fig. 6: the graph of y = 7x squared, for x from -3 to 5. -->
  <rect width="156" height="168" fill="white"/>
