<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 132" width="136pt" height="132pt" font-family="New Computer Modern" font-size="9.5">
  <!-- Fig. 2: the square of side x grows by dx each way (dx is about x/5). -->
  <rect width="136" height="132" fill="white"/>
  <!-- the two strips, each x by dx -->
  <rect x="22" y="6" width="90" height="18" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="1"/>
  <rect x="112" y="24" width="18" height="90" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="1"/>
  <!-- the little corner square, (dx) squared -->
  <rect x="112" y="6" width="18" height="18" fill="#b35c00" fill-opacity="0.2" stroke="#b35c00" stroke-width="1"/>
  <!-- the original square -->
  <rect x="22" y="24" width="90" height="90" fill="none" stroke="#444" stroke-width="1"/>
  <text x="67" y="127" text-anchor="middle" font-style="italic">x</text>
  <text x="121" y="127" text-anchor="middle" font-style="italic">dx</text>
  <text x="17" y="72.3" text-anchor="end" font-style="italic">x</text>
  <text x="17" y="18.3" text-anchor="end" font-style="italic">dx</text>
</svg>
