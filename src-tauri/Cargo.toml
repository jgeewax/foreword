[package]
name = "foreword"
version = "0.7.0"
description = "A Tauri App"
authors = ["JJ Geewax"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "foreword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
futures-util = "0.3.34"
ignore = "0.4.33"
notify = "8.2.0"
sha2 = "0.11.1"
hex = "0.4.3"
tokio = { version = "1.53.3", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2"
lopdf = { version = "0.38", default-features = false }
# The assistant's own tools (mcp.rs): a local HTTP server, from crates reqwest already brings in.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# EPUB export (epub.rs): its zip, and pictures sent from the page; versions reqwest and Tauri already bring in.
zip = { version = "4", default-features = false, features = ["deflate"] }
base64 = "0.22"
tauri-plugin-updater = "2"
# Spelling and grammar (proof/): Harper, offline and rule-based, for English; Typst's own parser to
# tell prose from markup, math and code (the minor version of the bundled Tinymist's Typst).
harper-core = { version = "=2.13.0", default-features = false, features = ["concurrent"] }
typst-syntax = "=0.15.1"
regex = "1"


# Spelling and grammar in dev builds too (tauri dev): unoptimised, Harper takes a second or more a chapter.
[profile.dev.package.harper-core]
opt-level = 3
[profile.dev.package.harper-brill]
opt-level = 3
[profile.dev.package.fst]
opt-level = 3
[profile.dev.package.levenshtein_automata]
opt-level = 3
[profile.dev.package.typst-syntax]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Native WKWebView access for preview snapshots (visual verification in the real app).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSObject", "NSRange", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSSpellChecker", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }
